global:
  resolve_timeout: 1m

route:
  receiver: 'discord-bridge'
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: 'discord-bridge'
    webhook_configs:
      - url: 'http://discord-bridge:9119/alert'
        send_resolved: true

inhibit_rules:
  # If the whole service is down, don't also page about latency on it.
  - source_matchers: [alertname = "ServiceDown"]
    target_matchers: [severity = "warning"]
    equal: [service]
